<!DOCTYPE html>
<!--
    The page the service worker shows when slskd cannot be reached. Not served
    as it is: the server fills in the message at offline.html beside it, and
    the service worker keeps a copy of that, since by the time this is needed
    there is no server to ask.

    Self-contained on purpose -- the icon is inline and nothing is linked --
    because the copy is the only thing the worker holds. A reference to
    anything else would be a request that fails in exactly the moment this
    page exists for.

    data-reason is "unreachable" as served. The worker rewrites it to
    "gateway" with a data-status when the server answered but slskd behind it
    did not (502, 503, 504), which is a different problem with a different
    explanation -- and the configured message is not that explanation, since
    it is written for not reaching the server at all.
-->
<html lang="en" data-reason="unreachable">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#1b1c1d" />
        <title>slskd</title>
        <style>
            html {
                background: #0d1116;
                color: #e6e6e6;
                color-scheme: dark;
                font-family: Lato, 'Helvetica Neue', Arial, Helvetica, sans-serif;
            }

            body {
                align-items: center;
                box-sizing: border-box;
                display: flex;
                justify-content: center;
                margin: 0;
                min-height: 100vh;
                padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
                    max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            }

            main {
                max-width: 28em;
                text-align: center;
            }

            svg {
                height: 72px;
                width: 72px;
            }

            h1 {
                font-size: 1.4em;
                margin: 0.9em 0 0.5em;
            }

            p {
                color: #b5b5b5;
                line-height: 1.5;
                margin: 0 0 0.8em;
                white-space: pre-line;
            }

            button {
                background: #2185d0;
                border: 0;
                border-radius: 4px;
                color: #fff;
                cursor: pointer;
                font: inherit;
                font-weight: bold;
                margin-top: 1em;
                padding: 0.75em 2em;
            }

            button:focus-visible {
                outline: 2px solid #54c8ff;
                outline-offset: 2px;
            }

            [data-reason='unreachable'] .gateway,
            [data-reason='gateway'] .unreachable {
                display: none;
            }
        </style>
    </head>
    <body>
        <main>
            <svg viewBox="0 0 490 490" aria-hidden="true">
                <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="245" x2="490" y2="245">
                    <stop offset="0" stop-color="#00C6FF" />
                    <stop offset="1" stop-color="#0072FF" />
                </linearGradient>
                <path fill="url(#g)" d="M464,58.2c-24.5-14.9-57.5-22.8-95.5-22.8c-58.3,0-122.5,18.4-180.2,50.4l-0.4-0.2c0,0-0.1,0.3-0.1,0.5c-17.5,9.7-34.4,20.5-50.3,32.6C43.8,190,17.6,274.6,39.7,319.8C15.5,361.1,0.6,403.9,0,454.6C46.5,365.9,74.5,294,226.1,173c-43.3,9.3-118.2,53.3-168.6,120.2c-4.8-39.1,26.1-102.2,95-154.6c8.7-6.6,17.8-12.8,27-18.7c-7.2,22.5-4.9,16.9-19.9,48.4c22.2-21,36.8-33.9,58.7-69.9c28.4-14,58-24.4,87.3-30.7c-4.9,16.1-14.1,43.3-26.6,64.9c0,0,31.7-6.8,57.9-5.3c-14.3,15.8-27.2,32.9-40.3,50.4c-17.9,23.9-36.4,48.7-60.1,71.7c-2.9,2.8-5.6,5.3-8.3,7.9c-36.4-3.5-60.5,10.1-83,34.2c17.8-8.3,41.6-15.1,56.6-11c-27.6,22.5-71,52.1-106.7,49.7c-6.8,10.3-7.2,10.6-14.6,23.1c57.9,14.4,130.6-44.4,173.3-86c25.1-24.4,44.2-49.9,62.7-74.6c38-50.9,70.9-94.8,143.8-111.5l29.7-6.8L464,58.2z" />
            </svg>

            <h1 class="unreachable">Can't reach slskd</h1>
            <p class="unreachable">{{message}}</p>

            <h1 class="gateway">slskd isn't responding</h1>
            <p class="gateway">The server answered<span id="status"></span>, but slskd behind it did not. It may be starting up, restarting or stopped.</p>

            <button type="button" id="retry">Try again</button>
        </main>
        <script>
            (function () {
                var status = document.documentElement.getAttribute('data-status');
                if (status) {
                    document.getElementById('status').textContent = ' with HTTP ' + status;
                }

                var retry = function () {
                    location.reload();
                };

                document.getElementById('retry').addEventListener('click', retry);

                // the network coming back is the most likely fix, so take it as the cue rather than waiting to be asked
                window.addEventListener('online', retry);
            })();
        </script>
    </body>
</html>
